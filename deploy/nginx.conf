# Credit Ventures – Nginx config (placeholders are replaced by setup-vps.sh)

# ---------------------------------------------------------------- API
server {
    listen 80;
    server_name __API_DOMAIN__;

    client_max_body_size 25M;   # KYC photo uploads

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ---------------------------------------------------------------- Admin panel (static React build)
server {
    listen 80;
    server_name __ADMIN_DOMAIN__;

    root __ADMIN_WEB__;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;   # client-side routing
    }
}
